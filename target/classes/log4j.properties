# Nivel de logging general (INFO permite evitar spam de DEBUG)
log4j.rootLogger=INFO, Console, ReportPortal

# Appender para la consola
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1} - %m%n

# Appender para ReportPortal
log4j.appender.ReportPortal=com.epam.reportportal.log4j.appender.ReportPortalAppender
log4j.appender.ReportPortal.layout=org.apache.log4j.PatternLayout
log4j.appender.ReportPortal.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n